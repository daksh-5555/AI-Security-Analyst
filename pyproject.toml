[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-analyst-backend"
version = "0.1.0"
description = "Backend API for AI Security Analyst, an AI-assisted security assessment platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "packaging>=24.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
# Optional advisory LLM explanations (M9). The deterministic core never needs it.
ai = [
    "anthropic>=1.0,<2.0",
]
# PostgreSQL deployments (M13); verified with psycopg 3.3 against PostgreSQL 16.
postgres = [
    "psycopg[binary]>=3.2,<4",
]
# LangGraph workflow orchestration (M14); WORKFLOW_ENGINE=langgraph. Verified
# with langgraph 0.2.76. The built-in engine needs none of this.
orchestration = [
    "langgraph>=0.2,<0.3",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The curated knowledge base ships with the package (M11).
"app.knowledge" = ["manifest.json", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
